<!-- ВСТАВЬ ЭТО В HTML ТАМ, ГДЕ БЫЛ БЛОК HERO -->
<section class="hero">
    <div class="hero-container">
        <!-- Левая колонка -->
        <div class="hero-content">
            <h1>DHelper <span class="highlight">Az</span></h1>
            <p class="subtitle">Sənin Rəqəmsal Köməkçin ☺️</p>
            
            <div class="hero-actions">
                <!-- ВЕРСИЯ ТЕПЕРЬ В КНОПКЕ -->
                <a id="download-btn" class="download-btn" href="#">
                    <i class="fa-brands fa-android"></i> APK Yüklə <span id="version-text" style="margin-left: 8px; opacity: 0.7; font-size: 12px;"></span>
                </a>
                <a class="telegram-btn" href="https://t.me/dhelperaz" target="_blank">
                    <i class="fa-brands fa-telegram"></i> Telegram
                </a>
            </div>

            <!-- Статистика -->
            <div class="hero-stats-column">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-bolt"></i></div>
                    <div class="stat-info"><h3>150 000+</h3><p>Uğurlu yoxlanış</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-mobile-screen"></i></div>
                    <div class="stat-info"><h3>Bütün</h3><p>Dəstəklənən Modellər</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-shield-halved"></i></div>

                </div>
            </div>
        </div>

        <!-- ПРАВАЯ ОБЛАСТЬ (3 СКРИНШОТА) -->
        <div class="hero-screenshots">
            <img src="screenshot1.jpg" alt="App Screen 1" class="sc-img">
            <img src="screenshot2.jpg" alt="App Screen 2" class="sc-img">
            <img src="screenshot3.jpg" alt="App Screen 3" class="sc-img">

<style>
    /* Стиль для области скриншотов */
    .hero-screenshots {
        display: flex;
        gap: 15px;
        flex: 1;
        justify-content: flex-end;
    }
    .sc-img {
        width: 180px;
        border-radius: 20px;
        border: 2px solid rgba(139, 92, 246, 0.2);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        transition: transform 0.3s;
    }
    .sc-img:hover { transform: scale(1.05); }
    
    @media (max-width: 992px) {
        .hero-screenshots { display: none; } /* Скрываем на мобильных, если нужно */
    }
</style>

<script>
// ОБНОВЛЕНИЕ ВЕРСИИ В КНОПКЕ
fetch('https://api.github.com/repos/imeiyoxla/imei-yoxla-site/releases/latest')
  .then(res => res.json())
  .then(data => {
    document.getElementById('version-text').innerText = data.tag_name;
    const btn = document.getElementById('download-btn');
    const apk = data.assets.find(a => a.name.endsWith('.apk'));
    if(apk) btn.href = apk.browser_download_url;
  });
</script>
