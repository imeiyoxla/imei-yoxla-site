<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHelperAz</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --primary-color: #8B5CF6;
        --primary-glow: rgba(139, 92, 246, 0.3);
        --bg-dark: #07090E;
        --card-bg: #111622;
        --card-border: rgba(255, 255, 255, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-dark); color: #FFFFFF; line-height: 1.6; }

    /* NAVBAR */
    .header-nav { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #FFFFFF; font-weight: 800; font-size: 22px; }
    .nav-logo img { width: 35px; height: 35px; border-radius: 8px; box-shadow: 0 4px 12px var(--primary-glow); }
    .nav-links { display: flex; gap: 30px; list-style: none; }
    .nav-links a { color: #A0AABF; text-decoration: none; font-weight: 600; transition: color 0.3s; }
    .nav-links a:hover { color: var(--primary-color); }
    
    .dropdown { position: relative; }
    .dropdown-content { position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(15px); background: var(--card-bg); min-width: 170px; border: 1px solid var(--card-border); border-radius: 12px; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 100; padding: 10px 0; }
    .dropdown-content.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(10px); }
    .dropdown-content a { display: block; padding: 10px 20px; color: #FFFFFF; text-decoration: none; font-size: 14px; text-align: center; }
    .dropdown-content a:hover { background: rgba(139, 92, 246, 0.15); color: var(--primary-color); }

    .nav-register-btn { background: var(--primary-color); color: #FFFFFF; padding: 10px 24px; border-radius: 50px; text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 8px; }

    /* HERO */
    .hero { padding: 60px 20px; background: radial-gradient(circle at center, #161224 0%, var(--bg-dark) 100%); }
    .hero-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: flex-start; gap: 40px; }
    .hero-content { flex: 1; }
    h1 { font-size: 54px; font-weight: 800; margin-bottom: 20px; line-height: 1.2; }
    .highlight { color: var(--primary-color); }
    .subtitle { font-size: 18px; color: #A0AABF; margin-bottom: 35px; }

    /* DÜYMƏLƏR */
    .hero-actions { display: flex; gap: 15px; margin-bottom: 40px; }
    .download-btn { background: var(--primary-color); color: #FFFFFF; padding: 14px 32px; border-radius: 12px; text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .telegram-btn { background: rgba(255, 255, 255, 0.05); color: #FFFFFF; padding: 14px 32px; border-radius: 12px; text-decoration: none; font-weight: 800; }

    /* SKRİNŞOTLAR BÖLMƏSİ */
    .hero-screenshots { flex: 1; display: flex; gap: 15px; justify-content: flex-end; }
    .sc-img { width: 140px; border-radius: 20px; border: 2px solid rgba(139, 92, 246, 0.2); transition: transform 0.3s; }
    .sc-img:hover { transform: translateY(-10px); }

    /* STATİSTİKA */
    .hero-stats-column { display: flex; flex-direction: column; gap: 15px; max-width: 380px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 15px 20px; display: flex; align-items: center; gap: 18px; }
    .stat-icon { background: rgba(139, 92, 246, 0.1); color: var(--primary-color); width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* RESPONSIVE */
    @media (max-width: 992px) { .hero-container { flex-direction: column; text-align: center; } .hero-screenshots { justify-content: center; } }
</style>
</head>

<body>

<header class="header-nav">
    <a href="#" class="nav-logo">
        <img src="Logo.png" alt="Logo">
        <span>DHelper <span class="highlight">Az</span></span>
    </a>
    <ul class="nav-links">
        <li class="dropdown">
            <a href="#" class="dropbtn" onclick="toggleDropdown(event)">Tariflər <i class="fa-solid fa-chevron-down"></i></a>
            <div class="dropdown-content" id="tariffsDropdown">
                <a href="#">7 Gün Pulsuz</a><a href="#">10 ₼ - 1 Ay</a>
                <a href="#">15 ₼ - 2 Ay</a><a href="#">25 ₼ - 3 Ay</a>
            </div>
        </li>
    </ul>
    <a href="register.html" class="nav-register-btn">Qeydiyyat</a>
</header>

<section class="hero">
    <div class="hero-container">
        
        <div class="hero-content">
            <h1>DHelper <span class="highlight">Az</span></h1>
            <p class="subtitle">Sənin Rəqəmsal Köməkçin ☺️</p>
            
            <div class="hero-actions">
                <a id="download-btn" class="download-btn" href="#">
                    <i class="fa-brands fa-android"></i> APK Yüklə 
                    <span id="version-text" style="font-size: 12px; opacity: 0.8; margin-left: 8px;"></span>
                </a>
                <a class="telegram-btn" href="https://t.me/dhelperaz" target="_blank">Telegram</a>
            </div>

            <div class="hero-stats-column">
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-bolt"></i></div><div><h3>150 000+</h3><p>Uğurlu yoxlanış</p></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-mobile-screen"></i></div><div><h3>Bütün</h3><p>Dəstəklənən Modellər</p></div></div>
            </div>
        </div>

        <!-- 3 SKRİNŞOT BURADA -->
        <div class="hero-screenshots">
            <img src="screen1.jpg" alt="App 1" class="sc-img">
            <img src="screen2.jpg" alt="App 2" class="sc-img">
            <img src="screen3.jpg" alt="App 3" class="sc-img">
        </div>
        
    </div>
</section>

<script>
    function toggleDropdown(e) { e.preventDefault(); document.getElementById("tariffsDropdown").classList.toggle("show"); }
    
    // Versiyanı çək və düyməyə yerləşdir
    fetch('https://api.github.com/repos/imeiyoxla/imei-yoxla-site/releases/latest')
    .then(res => res.json())
    .then(data => {
        document.getElementById('version-text').innerText = data.tag_name;
        const btn = document.getElementById('download-btn');
        const apk = data.assets.find(a => a.name.endsWith('.apk'));
        if(apk) btn.href = apk.browser_download_url;
    });
</script>

</body>
</html>
