name: Auto Update JSON
on:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate update.json
        run: |
          # Логика генерации данных
          VERSION_TAG=${{ github.event.release.tag_name }}
          VERSION=${VERSION_TAG#v}
          APK_NAME="IMEI.Yoxla.${VERSION}.apk"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION_TAG/$APK_NAME"
          
          # Пишем файл
          echo "{\"latestVersionCode\": \"$VERSION\", \"url\": \"$APK_URL\"}" > update.json

      - name: Push update.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update version to ${{ github.event.release.tag_name }}"
          file_pattern: 'update.json'
