name: Auto Update JSON

on:
  release:
    types:
      - published

jobs:
  update-json:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate update.json
        run: |
          VERSION_TAG="${{ github.event.release.tag_name }}"
          VERSION="${VERSION_TAG#v}"

          APK_NAME="IMEI.Yoxla.${VERSION}.apk"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/${APK_NAME}"

          cat > update.json << EOF
          {
            "latestVersionCode": "${VERSION}",
            "url": "${APK_URL}"
          }
          EOF

      - name: Commit and push update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto-update version to ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
