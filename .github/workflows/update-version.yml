name: Auto Update JSON
on:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ОЧЕНЬ ВАЖНО: это должно быть здесь
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Явно указываем токен

      - name: Update update.json
        run: |
          VERSION_TAG=${{ github.event.release.tag_name }}
          VERSION=${VERSION_TAG#v}
          APK_NAME="IMEI.Yoxla.${VERSION}.apk"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION_TAG/$APK_NAME"
          
          echo "{\"latestVersionCode\": \"$VERSION\", \"url\": \"$APK_URL\"}" > update.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Auto-update version to $VERSION"
          git push
