name: Auto Update JSON
on:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # ЭТО САМОЕ ВАЖНОЕ: принудительно переключаемся на main

      - name: Update update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Данные релиза
          VERSION_TAG=${{ github.event.release.tag_name }}
          VERSION=${VERSION_TAG#v}
          APK_NAME="IMEI.Yoxla.${VERSION}.apk"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION_TAG/$APK_NAME"
          
          # Пишем файл
          echo "{\"latestVersionCode\": \"$VERSION\", \"url\": \"$APK_URL\"}" > update.json
          
          # Добавляем, комитим и пушим
          git add update.json
          # Проверяем, есть ли изменения, чтобы не было ошибки "nothing to commit"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update version to $VERSION" && git push origin main)
